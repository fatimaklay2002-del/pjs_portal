name: pjs_portal
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  #backend
  supabase_flutter: ^2.12.0
  #state management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  #splashscreen:
  flutter_native_splash: ^2.4.4
  #UI
  flutter_svg: ^2.2.4
  cached_network_image: ^4.0.0
  # Image Picker
  image_picker: ^1.2.1
  file_picker: ^12.2.0
  # Local Storage
  shared_preferences: ^2.5.5


  get_it: ^9.2.1
  go_router: ^18.0.1
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  photo_view: ^0.15.0
  syncfusion_flutter_pdfviewer: ^34.2.6
  focused_menu: ^1.0.5
  intl: ^0.20.2
  excel_plus: ^2.17.0
  http: ^1.6.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^22.3.0












dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

# تأكدي أن هذا السطر يبدأ من الصفر (أول السطر بدون أي مسافة قبله)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_launcher_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_launcher_icon.png"





flutter:


  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSansArabic-ExtraLight.ttf
        - asset: fonts/IBMPlexSansArabic-Light.ttf
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf



flutter_native_splash:
  color: "#0B2545"
  background_image: assets/images/background.png
  android: true
  image: assets/images/splash_logo.png
  ios: true
  android_12:
   image: assets/images/splash_logo.png
   color: "#0B2545"
   background_image: assets/images/background.png

  fullscreen: true